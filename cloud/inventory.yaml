# This file contains a full inventory of nodes in my cloud and "fleet" (local machines)
# The idea is for this file to be used to drive Router configuration (DHCP leases) and Azure DNS (*.node.analogrelay.net and more)
#
# Each node has:
# * A name, which is the local hostname
# * A realm, which indicates a sort of primary purpose for the node. Is it for `home` use, `work` use?
# * A domain, which is the domain name that, when combined with the name, makes up the primary FQDN for the node

# All nodes in the inventory, organized by their primary "zone".
router: 192.168.1.1
zones:
  analogrelay.net:
    azureDns:
      subscription: 466cf680-808d-4446-94b3-f367eaa60ba1
      resourceGroup: analogcloud-dns
  home.analogrelay.net:
    partial: true
    azureDns:
      subscription: 466cf680-808d-4446-94b3-f367eaa60ba1
      resourceGroup: analogcloud-dns
    services:
    - name: paperless
      canonicalName: shinra.analogno.de
