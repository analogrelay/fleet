---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: letsencrypt@analogrelay.net
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-keys
    solvers:
    - dns01:
        azureDNS:
          clientID: 1e02d1c1-6e2c-412e-9d1a-f2fa0f4aa516
          clientSecretSecretRef:
            name: azuredns-config
            key: client-secret
          subscriptionID: 466cf680-808d-4446-94b3-f367eaa60ba1
          tenantID: 2be5c49d-d8ac-4700-a8a7-10668c406a70
          resourceGroupName: analogcloud-dns
          hostedZoneName: analogrelay.cloud
          environment: AzurePublicCloud
---
