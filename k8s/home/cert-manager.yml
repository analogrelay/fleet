---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: letsencrypt@analogrelay.net
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-keys
    solvers:
      - dns01:
          azureDNS:
            clientID: d7fa9573-9a20-4131-857f-62c1cf35a512
            clientSecretSecretRef:
              name: azuredns-config
              key: client-secret
            subscriptionID: 466cf680-808d-4446-94b3-f367eaa60ba1
            tenantID: 2be5c49d-d8ac-4700-a8a7-10668c406a70
            resourceGroupName: analogcloud-dns
            hostedZoneName: analogrelay.net
            environment: AzurePublicCloud
---
apiVersion: cert-manager.io/v1
