    privateKeySecretRef:
      name: letsencrypt-production-keys
    solvers:
    - dns01:
        azureDNS:
          clientID: f3a8c096-2ccb-4ae1-9ebf-91dca75bee52
          clientSecretSecretRef:
            name: azuredns-config
            key: client-secret
          subscriptionID: f40f3d83-69b4-4a51-88a7-3fed6830624a
          tenantID: 2be5c49d-d8ac-4700-a8a7-10668c406a70
          resourceGroupName: analogcloud-dns
          hostedZoneName: analogrelay.net
          environment: AzurePublicCloud