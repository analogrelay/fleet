---
apiVersion: v1
kind: Namespace
metadata:
  name: paperless

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
  name: redis
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.3-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--save", "1800", "1"]
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          ports:
            - name: redis
              containerPort: 6379
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis
      volumes:
        - name: redis-storage
          nfs:
            server: avalanche.node.analogrelay.net
            path: /mnt/data/k3s/shares/paperless.redis

---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: paperless
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tika
  name: tika
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          image: ghcr.io/paperless-ngx/tika:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: tika
              containerPort: 9998

---
apiVersion: v1
kind: Service
metadata:
  name: tika-svc
  namespace: paperless
spec:
  type: ClusterIP
  ports:
  - name: tika
    port: 9998
    targetPort: tika
    protocol: TCP
  selector:
    app: tika

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gotenberg
  name: gotenberg
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: docker.io/gotenberg/gotenberg:7.10
          imagePullPolicy: IfNotPresent
          command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
          ports:
            - name: gotenberg
              containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg-svc
  namespace: paperless
spec:
  type: ClusterIP
  ports:
  - name: gotenberg
    port: 3000
    targetPort: gotenberg
    protocol: TCP
  selector:
    app: gotenberg

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless
  name: paperless
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.6.3
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: cabinet
              mountPath: /opt/paperless
          env:
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: "http://gotenberg-svc.paperless.svc.cluster.local:3000"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: "http://tika-svc.paperless.svc.cluster.local:9998"
            - name: PAPERLESS_REDIS
              value: "redis://redis-svc.paperless.svc.cluster.local:6379"
            - name: PAPERLESS_DBHOST
              value: "postgres-svc.postgres.svc.cluster.local"
            - name: PAPERLESS_DBNAME
              value: "paperless"
            - name: PAPERLESS_DBUSER
              value: "paperless"
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: db-password
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/opt/paperless/consume"
            - name: PAPERLESS_DATA_DIR
              value: "/opt/paperless/data"
            - name: PAPERLESS_TRASH_DIR
              value: "/opt/paperless/trash"
            - name: PAPERLESS_MEDIA_ROOT
              value: "/opt/paperless/media"
            - name: PAPERLESS_ADMIN_USER
              value: "ashley"
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin-password
            - name: PAPERLESS_USE_X_FORWARDED_HOST
              value: "true"
            - name: PAPERLESS_USE_X_FORWARDED_PORT
              value: "true"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: cookie-secret
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: "https://cabinet.home.analogrelay.net,https://cabinet.bicorn-bebop.ts.net"
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "cabinet.home.analogrelay.net,cabinet.bicorn-bebop.ts.net"
            - name: PAPERLESS_CORS_ALLOWED_HOSTS
              value: "https://cabinet.home.analogrelay.net,https://cabinet.bicorn-bebop.ts.net"
            - name: PAPERLESS_CONSUMER_POLLING
              value: "30"
            - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
              value: "true"
            - name: PAPERLESS_CONSUMER_ENABLE_ASN_BARCODES
              value: "true"
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"invalidate_digital_signatures": true}'
            - name: PAPERLESS_CONSUMER_ASN_BARCODE_PREFIX
              value: "ASN"
          ports:
            - name: paperless
              containerPort: 8000
      volumes:
        - name: cabinet
          nfs:
            server: avalanche.node.analogrelay.net
            path: /mnt/data/shares/public/cabinet

---
apiVersion: v1
kind: Service
metadata:
  name: paperless-svc
  namespace: paperless
spec:
  type: ClusterIP
  ports:
  - name: paperless
    port: 80
    targetPort: paperless
    protocol: TCP
  selector:
    app: paperless

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ingress
  namespace: paperless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: cabinet.home.analogrelay.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paperless-svc
            port:
              number: 80
  tls:
    - hosts:
        - cabinet.home.analogrelay.net
      secretName: paperless-ingress-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ingress-ts
  namespace: paperless
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: paperless-svc
      port:
        number: 80
  tls:
    - hosts:
        - cabinet