---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: restore-paperless-
  namespace: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres-restore
          image: analogrelay/pg-backup:v1.7
          command: ["/app/restore.sh"]
          env:
            - name: BACKUP_ROOT
              value: /target
            - name: PGUSER
              value: postgres
            - name: PGHOST
              value: postgres-svc.postgres.svc.cluster.local
            - name: PGDATABASE
              value: paperless
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: root-password
          # Optional: Uncomment to restore a specific backup file instead of latest
          # - name: BACKUP_FILE
          #   value: /target/paperless.01-15-2026-02-00.backup.tar.gz
          # Optional: Uncomment to drop and recreate the database before restore
          # - name: RESTORE_DROP_EXISTING
          #   value: "1"
          volumeMounts:
            - mountPath: /target
              name: target
      restartPolicy: Never
      volumes:
        - name: target
          nfs:
            server: avalanche.node.analogrelay.net
            path: /mnt/data/shares/public/backups/postgres
  backoffLimit: 0
